<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Recuperar senha</h1>
        <p>Digite o seu e-mail cadastrado pra receber o link de redefinição.</p>

        <form id="form-esqueci-senha">
            <div class="input-box">
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <button type="submit" class="btn">Enviar link</button>
            <a href="index.html" class="btn-voltar">Voltar para o Login</a>
        </form>
    </div>

<script>
    document.getElementById('form-esqueci-senha').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const btnSubmit = document.querySelector('.btn');

        btnSubmit.innerText = 'Enviando...';
        btnSubmit.disabled = true;

        try {
            const response = await fetch('https://redesigned-bassoon-q7wp6grxwvpgf9g4x-8000.app.github.dev/auth/forgot-password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify ({ email }) 
            });

            const data = await response.json();

            if (response.ok) {
                alert('Se o e-mail estiver cadastrado, você receberá o link de recuperação em instantes!');
                document.getElementById('email').value = '';
            } else {
                alert(data.detail || 'Erro ao processar a solicitação. Tente novamente mais tarde.');
            }
        } catch (error) {
            console.error('Erro de conexão', error);
            alert('Erro ao conectar com o servidor.');
        } finally {
            btnSubmit.innerText = 'Enviar Link';
            btnSubmit.disabled = false;
        }
    });
    </script>
</body>
</html>
