<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Recuperar senha</h1>
        <p>Digite o seu e-mail cadastrado pra receber o link de redefinição.</p>

        <form id="form-esqueci-senha">
            <div class="input-box">
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <button type="button" class="btn">Enviar link</button>
            <a href="index.html" class="btn-voltar">Voltar para o Login</a>
        </form>
 
        <div id="mensagem" class="mensagem"></div> 
    </div>

<script>

    console.log("O ficheiro Javascript está ligado!");

    document.addEventListener('DOMContentLoaded', () => {
        console.log("A página carregou e encontrou o formulário");

        const form = document.getElementById('form-esqueci-senha');
        const emailInput = document.getElementById('email');
        const btnSubmit = document.querySelector('.btn'); 
        const mensagemEl = document.getElementById('mensagem'); 

        btnSubmit.addEventListener('click', async (e) => {
            e.preventDefault();

            console.log("O botão foi clicado!");
            
        mensagemEl.className = 'mensagem';
        mensagemEl.innerText = '';

        btnSubmit.innerText = 'Enviando...';
        btnSubmit.disabled = true;

        try {
            const response = await fetch('https://hvft7mf9-8000.brs.devtunnels.ms/auth/forgot-password', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json',
                'X-Tunnel-Skip-Anti-Phishing-Page': 'true'
                },
                body: JSON.stringify ({ email: emailInput.value }) 
            });

            const data = await response.json().catch(() => ({}));
            console.log("Resposta do servidor:", response.status, data); 
            
            if (response.ok) {
                console.log("Sucesso");
               mensagemEl.innerText = 'Solicitação de redefinição de senha concluída com sucesso! Verifique sua caixa de mensagem.';
                mensagemEl.classList.add('sucesso'); 
                mensagemEl.style.display = 'block';
                emailInput.value = '';
            } else { 
                mensagemEl.innerText = data.detail || 'Erro ao processar a solicitação.';
                mensagemEl.classList.add('erro');  
                mensagemEl.style.display = 'block';
            }
        } catch (error) {
            console.error('Erro de conexão', error);
            mensagemEl.innerText = 'Erro ao conectar com o servidor. Verifique sua conexão e tente novamente.';
            mensagemEl.classList.add('erro');
            mensagemEl.style.display = 'block';
        } finally {
            btnSubmit.innerText = 'Enviar Link';
            btnSubmit.disabled = false;
        }
        });
    });   
    </script>
</body>
</html>
