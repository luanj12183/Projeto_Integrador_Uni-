<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <form>
            <h1>Login</h1>
            <div class="input-box">
                <input id="email" placeholder="Usuário" type="email" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input id="senha" placeholder="senha" type="password">
                <i id="olhoSenha" class="bx bxs-lock-alt"></i>
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar minha senha
                </label>
                <a href="esquecisenha.html">Esqueci minha senha</a>
            </div>
            <button type="submit">Login</button>

            <div id="mensagem" style="margin-top:10px; text-align: center;"></div>

            <div class="register-link" style="margin-top: 15px; text-align: center;">
                <p>Ainda não tem conta ? <a href="cadastro.html">Cadastrar-se</a></p>
            </div>
        </form>
    </main>
    
    <script src="login.js"></script>
</body>
</html>
