<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="mensagem-feedback"></div>
    <main class="container">
        <form>
            <img class="Logo-Bloom" src="img/Logo-Bloom-png4.png"
            alt="Logo-Bloom Beauty">
            <div class="input-box">
                <input id="email" placeholder="Usuário" type="email" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box" style="position: relative;">
                <input type="password" id="senha" placeholder="Senha" required>
                <i class="bx bx-hide" onclick="toggleSenha('senha', this)" style="cursor: pointer;"></i>
            </div>
            <div class="remember-forgot">
                 <a href="cadastro.html"> Cadastre-se</a>
                <a href="esquecisenha.html">Esqueci minha senha</a>
            </div>
              <button type="submit">Entrar</button>
                  <div class="google-login">
                    <button type="button" id="googleLogin">
                      <i class="bx bxl-google"></i>
                      Entrar com Google
                       </button>
            </div>
        </form>
    </main>
    
    <script>
        function toggleSenha(inputId, icon) {
            const input = document.getElementById(inputId); 
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("bx-hide");
                icon.classList.add("bx-show");
            } else {
                input.type = "password";
                icon.classList.remove("bx-show");
                icon.classList.add("bx-hide");
            }
        }

</script>

<script src="login.js"></script>
</body>
</html>
