<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'> 
    <link rel="stylesheet" href="styles.css">

</head>
<body>
     <main class="container cadastro-container">
    <h1>Cadastro</h1>

    <form id="CadastroForm"> 

    <div class="input-box">
        <input type="text" id="nome" placeholder="Nome" required>
        <i class="bx bxs-user"> </i>
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="E-mail" required>
        <i class="bx bxs-envelope"></i>
    </div>

     <div class="input-box" style="position: relative;"> 
        <input type="password" id="senha" placeholder="Senha" required>
        <i class="bx bx-hide" onclick="toggleSenha('senha', this)" style="cursor: pointer;"></i> 
    </div>

     <div class="input-box" style="position: relative;"> 
        <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" required>
         <i class="bx bx-hide" onclick="toggleSenha('confirmar-senha', this)" style="cursor: pointer;"></i> 
    </div>

<div class="botoes-container">
    <button type="submit">Cadastrar</button>
    <button type="button" class="btn-voltar" onclick="window.history.back()">← Voltar</button> 
</div>
</form>
</main>
   
<script>
    const API_URL = "https://redesigned-bassoon-q7wp6grxwvpgf9g4x-8000.app.github.dev";

    function toggleSenha(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bx-hide');
            icon.classList.add('bx-show');
        } else {
            input.type = 'password';
            icon.classList.remove('bx-show');
            icon.classList.add('bx-hide');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('CadastroForm');
        const nomeInput = document.getElementById('nome'); 
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const confirmarSenhaInput = document.getElementById('confirmar-senha');
        const mensagemEl = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (senhaInput.value !== confirmarSenhaInput.value) {
                mensagemEl.innerText = "As senhas não coincidem!";
                mensagemEl.style.color = "red"; 
                return;
            }

            mensagemEl.innerText = "";

            try {
                const response = await fetch (`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nomeInput.value, 
                        email: emailInput.value,
                        password: senhaInput.value
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    mensagemEl.innerText = "Usuário cadastrado com sucesso!";
                    mensagemEl.style.color = "green";
                    form.reset();
                } else {
                    mensagemEl.innerText = data.detail || "Erro ao realizar cadastro.";
                    mensagemEl.style.color = "red";
                }
            } catch (error) {
                mensagemEl.innerText = "Erro ao conectar com o servidor.";
                mensagemEl.style.color = "red";
            }
        });
    });
</script> 
</body>
</html>
