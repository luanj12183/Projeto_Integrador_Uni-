<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
rel='stylesheet'> 
    <link rel="stylesheet" href="styles.css">

</head>
<body>
     <main class="container cadastro-container">
    <h1>Cadastro</h1>

<div class="container">

    <button type="button" onclick="window.location.back()"> 
        ← Voltar
    </button>

    <h2>Criar Conta</h2>

    <form id="cadastroForm">

        <div class="input-group">
            <label>E-mail:</label>
            <input type="email" id="email" placeholder="seuemail@gmail.com" required>
        </div>

<form>
    <div class="input-box">
        <input type="text" id="nome" placeholder="Nome" required>
        <i class="bx bxs-user"> </i>
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="E-mail" required>
        <i class="bx bxs-envelope"></i>
    </div>

     <div class="input-box" style="position: relative;"> 
        <input type="password" id="senha" placeholder="Senha" required>
        <i class="bx bx-hide" onclick="toggleSenha ('senha', this)" style="cursor: pointer;"><i> 
    </div>

     <div class="input-box">
        <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" required>
         <i class=" bx bx--hide" onclick="toggleSenha('confirmar-senha', this)" style="cursor: pointer;"><i> 
    </div>

    <button type="submit">Cadastrar</button>
    <div id="mensagem" class="mensagem" style="margin-top: 15px;"></div> 
</form>
</main>
   
<script>
    const API_URL = "https://redesigned-bassoon-q7wp6grxwvpgf9g4x-8000.app.github.dev";

    function toggleSenha(inputId, icon) {
        const input = document.getElementById(inputId);

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('form');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const confirmarSenhaInput = document.getElementById('confirmar-senha');
        const mensagemEl = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (senhaInput.value !== confirmarSenhaInput.value) {
                mensagemEl.innerText = "As senhas não coincidem!";
                mensagemEl.style.color = "red"; 
                return;
            }

            mensagemEl.innerText = "";

            try {
                const response = await fetch (`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailInput.value,
                        password: senhaInput.value
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    mensagemEl.innerText = "Usuário cadastrado com sucesso!";
                    mensagemEl.style.color = "green";
                    form.reset();
                } else {
                    mensagemEl.innerText = data.detail || "Erro ao realizar cadastro.";
                    mensagemEl.style.color = "red";
                }
            } catch (error) {
                mensagemEl.innerText = "Erro ao conectar com o servidor.";
                mensagemEl.style.color = "red";
            }
        });
    });
</script> 
</body>
</html>
