<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'> 
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="personaliza.css?v=2">

</head>
<body>
     <main class="container cadastro-container">
    <h1>Cadastro</h1>

    <form id="CadastroForm"> 

    <div class="input-box">
        <input type="text" id="nome" placeholder="Nome" required>
        <i class="bx bxs-user"> </i>
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="E-mail" required>
        <i class="bx bxs-envelope"></i>
    </div>

     <div class="input-box" style="position: relative;"> 
        <input type="password" id="senha" placeholder="Senha" required>
        <i class="bx bx-hide" onclick="toggleSenha('senha', this)" style="cursor: pointer;"></i> 
    </div>

     <div class="input-box" style="position: relative;"> 
        <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" required>
        <i class="bx bxs-lock-alt"></i>
    </div>

<button type="submit" class="btn">Cadastrar</button>
<a href="index.html" class="btn-voltar">Voltar para o Login</a>
</form>

<div id="mensagem" class="mensagem-feedback"></div>

<script>
    const API_URL = "https://redesigned-bassoon-q7wp6grxwvpgf9g4x-8000.app.github.dev";

    function toggleSenha(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bx-hide');
            icon.classList.add('bx-show');
        } else {
            input.type = 'password';
            icon.classList.remove('bx-show');
            icon.classList.add('bx-hide');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Seleção dos elementos do HTML
        const form = document.getElementById('CadastroForm');
        const nomeInput = document.getElementById('nome'); 
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const confirmarSenhaInput = document.getElementById('confirmar-senha');
        const mensagemEl = document.getElementById('mensagem');
        // Função que limpa as mensagens a serem exibidas
        const limparMensagem = () => {
            mensagemEl.innerText = '';
            mensagemEl.className = 'mensagem-feedback';
        };
        // Assosiação da função aos campos de texto 
        [nomeInput, emailInput, senhaInput, confirmarSenhaInput].forEach(input => {
            input?.addEventListener('input', limparMensagem);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (senhaInput.value !== confirmarSenhaInput.value) {
                mensagemEl.innerText = "As senhas não coincidem!";
                mensagemEl.className = "mensagem-feedback erro";
                return;
            }

            mensagemEl.innerText = "";

            try {
                const response = await fetch (`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nomeInput.value, 
                        email: emailInput.value,
                        password: senhaInput.value
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    mensagemEl.innerText = "Usuário cadastrado com sucesso!";
                    mensagemEl.className = "mensagem-feedback sucesso";
                    form.reset();
                } else {
                    const textoErro = (typeof data.detail === 'string' ? data.detail : 'Erro ao realizar o cadastro').replace(/\.$/, '')
                    mensagemEl.innerText = `${textoErro}!`;
                    mensagemEl.className = "mensagem-feedback erro"; 
                }
            } catch (error) {
                mensagemEl.innerText = "Erro ao conectar com o servidor.";
                mensagemEl.className = "mensagem-feedback erro";
            }
        });
    });
</script> 
</body>
</html>
