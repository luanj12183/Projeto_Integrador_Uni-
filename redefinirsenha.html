<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <main class="container">
        <h1>Criar Nova Senha</h1>
        <p style="text-align: center; width: 100%;">Digite e confirme sua nova senha de acesso.</p>

        <div class="input-box">
            <label for="nova-senha">Nova Senha</label>
            <div class="password-wrapper">
                <input type="password" id="nova-senha" placeholder=".........">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('nova-senha', this)">
                     <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>


        <form action="#" method="POST">
            <div class="input-box">
                <label for="new-password">Nova Senha</label>
                <input
                    type="password"
                    id="new-password"
                    name="newPassword" 
                    placeholder="Mínimo de 8 caracteres" 
                    minlength="8"
                    required
                >
            </div>

            <div class="input-box">
                <label for="confirm-password">Confirmar Nova Senha</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Repita a nova senha"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">Salvar Nova Senha</button>

            <div class="remember-forgot" style="justify-content: center; margin-top: 20px;">
                <a href="index.html">Voltar Para o Login</a>
            </div>
        </form>
    </main>

</body>
</html>
