<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="personaliza.css>
</head>
<body>
    
    <main class="container">
        <h1>Redefinir senha</h1>
        <p style="text-align: center; width: 100%;">Digite e confirme sua nova senha de acesso.</p>
        <form action="#" method="POST">

        <div class="input-box">
            <label for="nova-senha">Nova Senha</label>
            <div class="password-wrapper">
                <input type="password" id="nova-senha" name="new-Password" placeholder="Minímo de 8 caracteres" minlength="8" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('nova-senha', this)">
                     <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="input-box">
            <label for="confirmar-senha">Confirmar Nova Senha</label>
            <div class="password-wrapper">
                <input type="password" id="confirmar-senha" name="confirmPassword" placeholder="Repita a nova senha" minlength="8" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmar-senha', this)">
                    <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

            <button type="submit">Salvar Nova Senha</button>

            <div class="remember-forgot" style="justify-content: center; margin-top: 20px;">
                <a href="index.html">Voltar Para o Login</a>
            </div>
        </form>
    </main>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const svg = btn.querySelector('svg');

        if (input.type === 'password') {
            input.type = 'text';
            svg.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>  
                <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
        } else { 
            input.type = 'password';
            svg.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    }
    </script>
</body>
</html>
