<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="personaliza.css?v=2">
</head>
<body>
    
    <div class="container">
        <h1>Redefinir senha</h1>
        <p>Digite e confirme sua nova senha de acesso.</p>
        <form id="form-redefinir"> 

        <div class="input-group">
            <label for="confirmar-senha" style="text-align: left; display: block;color: #6b5344; width: 100%;">Nova Senha:</label>
            <div class="input-box password-wrapper">
            <input type="password" id="nova-senha" name="new-password" autocomplete="new-password" placeholder="Minímo de 8 caracteres" minlength="8" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('nova-senha', this)">
                     <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>


        <div class="input-group">
            <label for="nova-senha" style="text-align: left; display: block;color: #6b5344; width: 100%;">Confirmar Nova Senha:</label>
            <div class="input-box password-wrapper">
                <input type="password" id="confirmar-senha" name="confirmPassword" autocomplete="new-password" placeholder="Repita a nova senha" minlength="8" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmar-senha', this)">
                    <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

            <button type="submit" class="btn">Salvar Nova Senha</button>

                <a href="index.html" class="btn-voltar">Voltar Para o Login</a>
        </form>

            <div id="mensagem-feedback class="mensagem-feedback"></div>
    </div> 

<script>

    const API_URL = "https://redesigned-bassoon-q7wp6grxwvpgf9g4x-8000.app.github.dev"; 
    
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const svg = btn.querySelector('svg');

        if (input.type === 'password') {
            input.type = 'text';
            svg.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>  
                <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
        } else { 
            input.type = 'password';
            svg.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('form-redefinir');
        const novaSenhaInput = document.getElementById('nova-senha');
        const confirmarSenhaInput = document.getElementById('confirmar-senha'); 
        const mensagemEl = document.getElementById('mensagem');

        const limparMensagem = () => {
            mensagemEl.innerText = '';
            mensagemEl.className = 'mensagem-feedback';
        };

        novaSenhaInput.addEventListener('input', limparMensagem);
        confirmarSenhaInput.addEventListener('input', limparMensagem);
    
        const token = new URLSearchParams(window.location.search).get('token');

        if (!token) {
            mensagemEl.innerText = 'Token ausente ou inválido. Solicite novamente pelo email!';
            mensagemEl.className = 'mensagem-feedback erro';
         }

         form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!token) return; 

            if (novaSenhaInput.value !== confirmarSenhaInput.value) {
                mensagemEl.innerText = 'As senhas não coincidem!';
                mensagemEl.className = 'mensagem-feedback erro';
                return;
            }

            mensagemEl.className = 'mensagem-feedback';
            mensagemEl.innerText = '';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ token: token, new_password: novaSenhaInput.value })
            });

            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                mensagemEl.innerText = 'Senha alterada com sucesso!';
                mensagemEl.className = 'mensagem-feedback sucesso';
            } else { 
                const textoErro = (data.detail || 'Erro ao redefinir a senha').replace(/\.$/,'');
                mensagemEl.innerText = `${textoErro}!`;
                mensagemEl.className = 'mensagem-feedback erro';
            }
        } catch (error) {
            mensagemEl.innerText = 'Erro ao conectar com o servidor.'; 
            mensagemEl.className = 'mensagem-feedback erro'; 
        }
    });
});
</script>
</body>
</html>
